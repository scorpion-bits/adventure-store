# Testes a cada push e pull request: lógica (Node) e jogo no navegador (Playwright, GL por software).
name: Testes

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: 'true'
      - run: npm run build && npm run build:site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: tests/out/
