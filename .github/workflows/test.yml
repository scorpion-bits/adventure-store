# Testes em todo pull request e a cada push na main: lógica (Node) e jogo no navegador (Playwright, GL por software).
# (Não roda em push de branch com PR aberto: o pull_request já cobre, e assim não chegam dois avisos por mudança.)
name: Testes

on:
  push:
    branches: [main]
  pull_request:

# uma execução nova cancela a anterior da mesma branch (menos avisos de falha por commits seguidos)
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: 'true'
      - run: npm run build && npm run build:site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: tests/out/
