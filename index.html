<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Loja do Aventureiro</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b130f; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      canvas { display: block; touch-action: none; }
      /* mede as áreas seguras do aparelho (notch, barra de gestos) */
      #safe { position: fixed; visibility: hidden; pointer-events: none; inset: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    </style>
  </head>
  <body>
    <div id="safe"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
